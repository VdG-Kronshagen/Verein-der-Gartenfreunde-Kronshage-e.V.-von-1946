<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VdG Kronshagen</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#f4f7f4;color:#2c3e2c;display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center;text-align:center}
.box{max-width:420px;padding:28px}img{width:96px;height:96px;object-fit:contain;margin-bottom:12px}
h1{font-size:20px;margin:.3em 0}p{color:#5a6b5a;line-height:1.5}</style>
</head><body><div class="box">
<img src="logo.jpg" alt="" onerror="this.style.display='none'">
<h1>Verein der Gartenfreunde Kronshagen</h1>
<p>Die Mitgliederverwaltung wird nicht mehr online betrieben.<br>Sie läuft jetzt lokal beim Verein.</p>
</div>
<script>
// Alten Service-Worker + Cache entfernen, damit Geräte die frühere App nicht mehr laden.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}
</script>
</body></html>
